<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Doc Writer</title>
    <meta name="description" content="A modern, feature-rich word processor with a clean interface, rich text editing, document formatting, and integrated AI for smart writing assistance." />
    <meta property="og:title" content="Doc Writer" />
    <meta property="og:description" content="A modern, feature-rich word processor with a clean interface, rich text editing, document formatting, and integrated AI for smart writing assistance." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script>
      // Shim for process for compatibility with libraries on Cloudflare Pages/static hosting
      window.process = window.process || { env: {} };
    </script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Roboto:wght@300;400;500;700&family=Open+Sans:wght@300;400;500;600;700&family=Lato:wght@300;400;700&family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@300;400;500;600;700&family=Raleway:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            screens: {
              'xs': '480px',
            },
            colors: {
              brand: {
                50: '#eef2ff',
                100: '#e0e7ff',
                200: '#c7d2fe',
                300: '#a5b4fc',
                400: '#818cf8',
                500: '#6366f1',
                600: '#4f46e5',
                700: '#4334ca',
                800: '#3730a3',
                900: '#312e81',
                950: '#1e1b4b',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Noto Serif', 'serif'],
            },
            animation: {
              'in': 'fadeIn 0.2s ease-out',
              'slide-in-from-top': 'slideInFromTop 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'slide-in-from-left': 'slideInFromLeft 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'zoom-in': 'zoomIn 0.2s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideInFromTop: {
                '0%': { transform: 'translateY(-10px)', opacity: 0 },
                '100%': { transform: 'translateY(0)', opacity: 1 },
              },
              slideInFromLeft: {
                '0%': { transform: 'translateX(-100%)' },
                '100%': { transform: 'translateX(0)' },
              },
              zoomIn: {
                '0%': { transform: 'scale(0.95)', opacity: 0 },
                '100%': { transform: 'scale(1)', opacity: 1 },
              }
            }
          }
        }
      }
    </script>
</head>
  <body class="fixed inset-0 bg-[#f0f2f5] dark:bg-slate-950 overflow-hidden text-slate-900 dark:text-slate-100 font-sans antialiased selection:bg-indigo-200 selection:text-indigo-900">
    <div id="root" class="h-full flex flex-col"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
